name: Publicar edge functions

# Publica as três functions do respondente sempre que elas mudam.
#
# NÃO roda `supabase db push`, de propósito. As migrations foram aplicadas à
# mão pelo SQL Editor, então a tabela de controle do Supabase não tem registro
# delas — um `db push` tentaria recriar os tipos e falharia. Migration nova
# continua sendo passo manual até alguém rodar `supabase migration repair` para
# sincronizar o histórico. Está descrito no INSTALL.md.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          for f in responder-inicio responder-salvar responder-concluir; do
            echo "→ $f"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF"
          done
